<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form - ระบบจัดการคำสั่งซื้อ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500&family=Cinzel:wght@500;700&display=swap');

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%),
                url('https://www.transparenttextures.com/patterns/white-diamond.png');
            min-height: 100vh;
            margin: 0;
            padding: 50px 0;
            font-family: 'Sarabun', sans-serif;
        }

        .card {
            border: 2px solid #d4af37;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "🏮";
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5rem;
            opacity: 0.5;
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: #8c6d1f;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .form-label {
            color: #5d4037;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .form-control {
            border: 1px solid #d7ccc8;
            background-color: #fafafa;
            border-radius: 0;
        }

        .form-control:focus {
            border-color: #d4af37;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        .table {
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .table thead {
            background-color: #8c6d1f;
            color: #fff;
        }

        .table-light {
            --bs-table-bg: #f5f5f5;
            border-bottom: 2px solid #d4af37;
        }

        .btn-primary {
            background: linear-gradient(to bottom, #d4af37, #b8860b);
            border: 1px solid #8c6d1f;
            color: white;
            font-family: 'Cinzel', serif;
            border-radius: 0;
            transition: 0.3s;
        }

        .btn-primary:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        .btn-dark {
            background: #2c3e50;
            border: 1px solid #d4af37;
            border-radius: 0;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        .total-section {
            border-top: 3px double #d4af37;
            padding-top: 20px;
            color: #5d4037;
        }

        #grandTotal {
            color: #b8860b;
            font-size: 2rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card p-4">
            <h2 class="mb-4">Order Form</h2>

            <div class="row g-3 mb-4">
                <div class="col-md-2">
                    <label for="orderNumber" class="form-label">Order#</label>
                    <input type="text" class="form-control" id="orderNumber" placeholder="เช่น ORD001">
                </div>
                <div class="col-md-5">
                    <label for="customerName" class="form-label">ชื่อลูกค้า</label>
                    <input type="text" class="form-control" id="customerName">
                </div>
                <div class="col-md-5">
                    <label for="phone" class="form-label">เบอร์โทรศัพท์</label>
                    <input type="text" class="form-control" id="phone">
                </div>
                <div class="col-12">
                    <label for="address" class="form-label">ที่อยู่</label>
                    <textarea class="form-control" id="address" rows="2"></textarea>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 40%;">รายการสั่งซื้อ</th>
                            <th>ราคาต่อหน่วย</th>
                            <th style="width: 15%;">จำนวน</th>
                            <th>ราคารวม</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="itemTableBody">
                        <tr>
                            <td><input type="text" id="inputName" class="form-control table-input"></td>
                            <td><input type="number" id="inputPrice" class="form-control table-input" min="1"></td>
                            <td><input type="number" id="inputQty" class="form-control table-input" min="1"></td>
                            <td id="rowTotal">0</td>
                            <td class="text-center">
                                <button class="btn btn-primary w-100" onclick="addItem()">Add</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <h4 class="fw-bold">ราคารวม: <span id="grandTotal">0</span> บาท</h4>
                <button class="btn btn-dark px-5 py-2" onclick="submitOrder()">Order</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
